[package]
name = "scoutd"
description = "Scout 团队归档 MCP daemon：headless 服务，包装 hybrid 检索给 MCP 客户端用。BETA-32 C3 起骨架。"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "scoutd"
path = "src/main.rs"

[dependencies]
# 项目内 crate
scout-server = { path = "../../packages/scout-server" }
scout-indexer = { path = "../../packages/indexer" }
scout-model-runtime = { path = "../../packages/model-runtime" }
scout-search-backend = { path = "../../packages/search-backends/common" }
scout-result-normalizer = { path = "../../packages/result-normalizer" }

# Async runtime（daemon 需要 multi-thread + signal + time）
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time"] }

# HTTP server 框架（与 scout-server 对齐 0.8）
axum = "0.8"

# CLI 解析
clap = { version = "4", features = ["derive", "env"] }

# 凭据封装（Bearer token）
secrecy = "0.10"

# TOML 配置文件解析
toml = "0.8"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
# service 模式写日志文件用（Windows Service 无 console，stdout 写了也没人能看到，
# 见 service.rs 里的 init_tracing_to_file；版本与桌面端 tracing-appender 对齐）。
tracing-appender = "0.2"

# 错误处理
anyhow = "1"

# 并发原语（与 scout-server::ServerCtx 一致，main.rs 构造 ctx 时用）
parking_lot = "0.12"

# 时间戳（RuntimeState.indexed_at）
chrono = { version = "0.4", features = ["serde"] }

# 随机 token 生成（个人模式 bootstrap）
rand = "0.8"

# 个人模式 config.toml / connection.json 手写序列化
serde = { version = "1", features = ["derive"] }

# 个人模式首启自动下载 embedding 模型；同时供既有 e2e 测试用（json 特性）
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
serde_json = "1"

# Windows Service 注册/运行（LocalSystem、开机自启，读 NTFS MFT 需要的特权边界）
[target.'cfg(windows)'.dependencies]
windows-service = "0.7"

[dev-dependencies]
tempfile = "3"
