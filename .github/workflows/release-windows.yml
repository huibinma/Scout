name: Release Windows

# 触发：推送 v* 标签自动构建；或在 Actions 页手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（如 v0.1.0），手动触发时必填"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write # tauri-action 创建 Release 需要写权限
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm install # 仓库未追踪 package-lock.json，故用 install 而非 ci

      # BETA-32 follow-up ④：守 Cargo.lock 与 Cargo.toml 一致、防 CI 静默重生 lock
      # 漂移本地 dep set。`cargo metadata --locked` 在 lock 缺 / 不一致 / Cargo.toml
      # 改了 dep 但 lock 没同步时 fail-fast；与下方 tauri build `args` 的
      # `-- --locked` 透传形成两道守门（透传依赖 tauri build CLI 行为、verify step
      # 直接走 cargo、更稳）。本 step 失败即 fail job、不进 tauri build。
      - name: Verify Cargo.lock pin (--locked)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # 构建说明（model-fallback + semantic-recall feature）：
      #   - `args: --features model-fallback,semantic-recall` 让 tauri build 透传给 cargo，
      #     同时启用 (a) 模型 fallback 真推理（BETA-23/24）+ (b) BETA-15B-1 语义召回 embedding；
      #     两者共用 llama-cpp 后端（windows-latest 已自带 cmake）。Windows 走 CPU 推理（无 metal）。
      #   - `-- --locked` 把 `--locked` 透给底层 cargo build（tauri build `--` 之后透 cargo flags）。
      #     与 release-daemon.yml `cargo build --locked` 同款语义：保 release binary 与 Cargo.lock
      #     一致、防 CI 静默重生 lock 导致与本地 dep set 漂移（BETA-32 follow-up ④、T12 reviewer 提）。
      #   - 两个模型文件均不打包进安装包；用户需手动放置到 %APPDATA%\Scout\models\：
      #       · 生成 fallback 模型 qwen3-0.6b-q4_k_m.gguf（可选，启用 AI 解析）
      #       · 语义召回 embedding 模型 qwen3-embedding-0.6b-q4_k_m.gguf（可选，启用「按意思找到」）
      #     （对应 dirs::data_dir()/Scout/models/，即 AppData\Roaming）；
      #     不放置则各自静默降级（fallback→parser-only / 语义召回→FTS-only）。
      #   - Release 说明中须包含此放置指引（CONVENTIONS §8 changelog 要求）。
      #   - BETA-25：llama-cpp-4 已关默认 dynamic-link 走静态链接，安装包不再依赖
      #     外部 llama DLL（修复此前 NSIS 缺 DLL 的隐患）。
      #   - BETA-15B-4 注：Windows semantic-recall（embedding）首次真机随本次发版验证（NSIS/DLL/embedding 加载）。
      #
      # SignPath 签名接入暂缓（GitHub secrets/variables 尚未配置，见 CODE_SIGNING.md /
      # .signpath/artifact-configuration.xml）：本 step 暂时直接构建 + 发布 unsigned 安装包，
      # 待 SignPath 侧配置补齐后再恢复「build → 上传 artifact → 提交签名 → 校验 → 发布」链路。
      - name: Build Tauri app + create Release
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # llama.cpp 是 C++ 静态库；Rust、llama.cpp 与 Tauri 最终链接三侧统一用静态
          # MSVC CRT（/MT），避免安装机上的 MSVCP140.dll 版本/修复级别成为运行时变量。
          # `crt-static` 统一 Rust CRT；WebView2LoaderStatic 等预编译 C++ 对象仍可能
          # 请求动态 msvcprt，因此最终链接显式屏蔽它并改选静态 libcpmt。
          RUSTFLAGS: >-
            -C target-feature=+crt-static
            -C link-arg=/NODEFAULTLIB:msvcprt.lib
            -C link-arg=/DEFAULTLIB:libcpmt.lib
          LLAMA_STATIC_CRT: "1"
          # tauri-build 会据此屏蔽动态 msvcrt/vcruntime 默认库，并显式选择静态 CRT；
          # 仅设置 RUSTFLAGS 无法覆盖 WebView2LoaderStatic.lib 参与的最终链接。
          STATIC_VCRUNTIME: "true"
        with:
          projectPath: apps/desktop # 含 src-tauri 与前端 package.json
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Scout ${{ github.event.inputs.tag || github.ref_name }}"
          # 占位模板：真实 changelog 按 CONVENTIONS §8 在发版后用
          # `gh release edit <tag> --notes-file <file>` 补全（勿依赖此静态文案）。
          releaseBody: |
            Scout Windows 测试版（NSIS 安装包）。

            - 由 GitHub Actions 在 windows-latest 上自动构建。
            - SignPath 免费 OSS 签名接入中（GitHub secrets/variables 待补齐），本次安装包暂未签名，
              首次运行 Windows SmartScreen 可能提示，选择「更多信息 → 仍要运行」即可。签名恢复后另行说明。
            - 放行步骤 / SHA256 校验 / 升级卸载说明：见 [安装指南](https://github.com/huibinma/Scout/blob/main/docs/install.md)。

            **模型文件（均可选，首选应用内「快速入门」一键下载；也可手动放置到 `%APPDATA%\Scout\models\`）：**
            - `embeddinggemma-300m-q8_0.gguf` —— 语义召回 embedding 模型（启用「按意思找到」/ 跨语言）。缺失则语义召回降级纯关键词（FTS）。
            - `qwen3-0.6b-q4_k_m.gguf` —— 生成模型 fallback（复杂查询 AI 解析）。缺失则降级 parser-only。

            两者均不放置也可正常使用（纯关键词搜索）。「选项 → 常规 / 语义召回」可查看各模型状态。

            （详细 changelog 发版后补全）
          releaseDraft: false
          prerelease: true
          args: --features model-fallback,semantic-recall -- --locked

      # 防止后续依赖/构建脚本漂移把 C++ 动态 CRT 偷偷带回来。MSVCP/VCRUNTIME 是本次
      # 真机 AppCrash 的关键指纹；Release exe 必须在 CI 中证明不再导入它们。
      - name: Verify no dynamic MSVC runtime imports
        shell: pwsh
        run: |
          # Scout 使用根 workspace 的共享 target 目录；tauri-action 的 projectPath
          # 不会把 Cargo target 移到 apps/desktop/src-tauri/target。
          $exe = Resolve-Path "target/release/scout-desktop.exe"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $dumpbin) {
            throw "找不到 dumpbin.exe，无法验证 Windows CRT 导入"
          }
          $imports = (& $dumpbin.FullName /DEPENDENTS $exe) | Out-String
          $imports
          if ($imports -match '(?i)\b(?:MSVCP|VCRUNTIME)\d+[^\s]*\.dll\b') {
            # 失败时同时打印具体导入符号，便于定位是哪组静态对象把动态 C++ CRT
            # 带回最终 EXE；成功路径不增加日志噪声。
            (& $dumpbin.FullName /IMPORTS:MSVCP140.dll $exe) | Out-String | Write-Host
            throw "Scout Desktop 仍导入动态 MSVC C/C++ runtime"
          }
