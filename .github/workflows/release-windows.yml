name: Release Windows

# 触发：推送 v* 标签自动构建；或在 Actions 页手动触发（workflow_dispatch）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release 标签（如 v0.1.0），手动触发时必填"
        required: true

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      actions: read # SignPath GitHub connector 校验构建来源并读取 workflow artifact
      contents: write # tauri-action 创建 Release 需要写权限
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Rust cache
        uses: swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"

      - name: Install frontend deps
        working-directory: apps/desktop
        run: npm install # 仓库未追踪 package-lock.json，故用 install 而非 ci

      # BETA-32 follow-up ④：守 Cargo.lock 与 Cargo.toml 一致、防 CI 静默重生 lock
      # 漂移本地 dep set。`cargo metadata --locked` 在 lock 缺 / 不一致 / Cargo.toml
      # 改了 dep 但 lock 没同步时 fail-fast；与下方 tauri build `args` 的
      # `-- --locked` 透传形成两道守门（透传依赖 tauri build CLI 行为、verify step
      # 直接走 cargo、更稳）。本 step 失败即 fail job、不进 tauri build。
      - name: Verify Cargo.lock pin (--locked)
        working-directory: apps/desktop/src-tauri
        shell: bash
        run: cargo metadata --locked --format-version 1 > /dev/null

      # 构建说明（model-fallback + semantic-recall feature）：
      #   - `args: --features model-fallback,semantic-recall` 让 tauri build 透传给 cargo，
      #     同时启用 (a) 模型 fallback 真推理（BETA-23/24）+ (b) BETA-15B-1 语义召回 embedding；
      #     两者共用 llama-cpp 后端（windows-latest 已自带 cmake）。Windows 走 CPU 推理（无 metal）。
      #   - `-- --locked` 把 `--locked` 透给底层 cargo build（tauri build `--` 之后透 cargo flags）。
      #     与 release-daemon.yml `cargo build --locked` 同款语义：保 release binary 与 Cargo.lock
      #     一致、防 CI 静默重生 lock 导致与本地 dep set 漂移（BETA-32 follow-up ④、T12 reviewer 提）。
      #   - 两个模型文件均不打包进安装包；用户需手动放置到 %APPDATA%\Scout\models\：
      #       · 生成 fallback 模型 qwen3-0.6b-q4_k_m.gguf（可选，启用 AI 解析）
      #       · 语义召回 embedding 模型 qwen3-embedding-0.6b-q4_k_m.gguf（可选，启用「按意思找到」）
      #     （对应 dirs::data_dir()/Scout/models/，即 AppData\Roaming）；
      #     不放置则各自静默降级（fallback→parser-only / 语义召回→FTS-only）。
      #   - Release 说明中须包含此放置指引（CONVENTIONS §8 changelog 要求）。
      #   - BETA-25：llama-cpp-4 已关默认 dynamic-link 走静态链接，安装包不再依赖
      #     外部 llama DLL（修复此前 NSIS 缺 DLL 的隐患）。
      #   - BETA-15B-4 注：Windows semantic-recall（embedding）首次真机随本次发版验证（NSIS/DLL/embedding 加载）。
      # 只构建、不直接上传 Release。Windows 安装包必须先作为 GitHub workflow artifact
      # 提交给 SignPath；SignPath connector 会校验构建确由本 workflow 的 GitHub-hosted
      # runner 产出。签名完成前不发布 unsigned 安装包，避免 Release 混入同名未签名资产。
      - name: Build Tauri app
        id: build-tauri
        uses: tauri-apps/tauri-action@fce9c6108b31ea247710505d3aaaa893ee6768d4 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop # 含 src-tauri 与前端 package.json
          args: --features model-fallback,semantic-recall -- --locked

      - name: Verify SignPath configuration
        shell: pwsh
        env:
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          SIGNPATH_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
        run: |
          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_ARTIFACT_CONFIGURATION_SLUG
          }
          $missing = @($required.GetEnumerator() | Where-Object {
            [string]::IsNullOrWhiteSpace([string]$_.Value)
          } | ForEach-Object { $_.Key })
          if ($missing.Count -gt 0) {
            throw "SignPath 尚未配置，缺少 GitHub secret/variables: $($missing -join ', ')"
          }

      # SignPath 的 GitHub connector 只接受先上传到 GitHub 的 workflow artifact。
      # upload-artifact 会生成 ZIP，因此 SignPath 端 artifact configuration 的根元素
      # 必须是 <zip-file>；仓库内参考配置见 .signpath/artifact-configuration.xml。
      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: scout-windows-unsigned-${{ steps.build-tauri.outputs.appVersion }}
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # 免费代码签名由 SignPath.io 提供、证书由 SignPath Foundation 提供。
      # OSS 订阅要求每次 Release 由 approver 人工批准；本 step 会等待批准并下载签名产物。
      - name: Submit SignPath signing request
        id: sign-installer
        uses: signpath/github-action-submit-signing-request@b9d91eadd323de506c0c81cf0c7fe7438f3360fd # v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned-installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed-windows
          parameters: |
            version: ${{ toJSON(steps.build-tauri.outputs.appVersion) }}

      - name: Verify signed installer exists
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem -Path signed-windows -Filter '*-setup.exe' -File -Recurse)
          if ($installers.Count -ne 1) {
            throw "期望 SignPath 返回 1 个 NSIS 安装包，实际为 $($installers.Count) 个"
          }
          Get-AuthenticodeSignature $installers[0].FullName | Format-List Status, StatusMessage, SignerCertificate
          $signature = Get-AuthenticodeSignature $installers[0].FullName
          if ($signature.Status -ne 'Valid') {
            throw "SignPath 安装包签名无效：$($signature.Status) $($signature.StatusMessage)"
          }

      # macOS workflow 可能先创建同 tag Release；softprops/action-gh-release 对已有 Release
      # 幂等追加 Windows 资产。真实 changelog 仍按 CONVENTIONS §8 发版后统一补全。
      - name: Publish signed Windows installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: "Scout ${{ github.event.inputs.tag || github.ref_name }}"
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: signed-windows/**/*-setup.exe
          body: |
            Scout Windows 测试版（经 Authenticode 签名的 NSIS 安装包）。

            - 由 GitHub Actions 在 `windows-latest` 上自动构建。
            - Free code signing provided by [SignPath.io](https://about.signpath.io/), certificate by [SignPath Foundation](https://signpath.org/).
            - [Code signing policy](https://github.com/huibinma/Scout/blob/main/CODE_SIGNING.md) / [安装指南](https://github.com/huibinma/Scout/blob/main/docs/install.md)。

            **模型文件（均可选，首选应用内「快速入门」一键下载；也可手动放置到 `%APPDATA%\Scout\models\`）：**
            - `embeddinggemma-300m-q8_0.gguf` —— 语义召回 embedding 模型。
            - `qwen3-0.6b-q4_k_m.gguf` —— 复杂查询的生成模型 fallback。

            两者均不放置也可正常使用（纯关键词搜索）。详细 changelog 发版后补全。
